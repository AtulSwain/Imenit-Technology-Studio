# Keeps the published website in sync with the source code.
#
# GitHub Pages is set to "Deploy from a branch → main / (root)", which serves files as-is.
# This workflow rebuilds the site whenever source changes on main and commits the finished
# files (index.html + assets/) to the repository root, where Pages picks them up.
name: Build website

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit the built site if it changed
        run: |
          git add -A index.html assets favicon.svg favicon-32.png apple-touch-icon.png og-image.png robots.txt sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo "Built site is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild website"
            git push
          fi
